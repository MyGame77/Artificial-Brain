<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071017"><title>Artificial Brain</title>
<style>
:root{color-scheme:dark;--bg:#05090d;--panel:#0a141b;--line:#15313b;--green:#7cffb2;--cyan:#42e8ff;--text:#d9f4ef;--muted:#72909b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0%,#10242a,transparent 48%),var(--bg);color:var(--text);font:14px ui-monospace,monospace;min-height:100vh}.shell{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px}.top{padding:20px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{color:var(--green);letter-spacing:2px;font-weight:bold}.status{font-size:11px;color:var(--muted)}.intro{padding:22px 0 12px}.intro h1{font-size:20px;color:var(--green);margin:0 0 8px}.intro p{color:var(--muted);font-size:12px;line-height:1.7}.messages{flex:1;min-height:45vh;padding:12px 0 24px}.msg{margin:14px 0}.who{font-size:10px;color:var(--cyan);margin-bottom:6px;letter-spacing:1px}.msg.user .who{color:var(--green)}.body{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border-left:2px solid var(--cyan);padding:13px;line-height:1.7}.msg.user .body{border-left-color:var(--green)}.composer{position:sticky;bottom:0;background:#071017;padding:14px 0 20px;border-top:1px solid var(--line)}.entry{display:flex;gap:8px;border:1px solid #1b454a;padding:8px;background:#081219}.entry textarea{flex:1;min-width:0;resize:vertical;min-height:44px;max-height:180px;border:0;outline:0;background:transparent;color:var(--text);font:13px/1.6 ui-monospace,monospace;padding:8px}.entry button{border:1px solid #32785b;background:#0d2b20;color:var(--green);padding:0 18px;font:12px ui-monospace,monospace}.entry button:disabled{opacity:.5}.note{font-size:10px;color:var(--muted);padding-top:8px}@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.entry button{padding:0 12px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">[ ARTIFICIAL BRAIN ]</div><div class="status" id="status">Backend not configured</div></header><section class="intro"><h1>NEURAL INTERFACE</h1><p>GitHub Pages frontend · Android-hosted local model. Your model stays on your phone.</p></section><section class="messages" id="messages"><div class="msg"><div class="who">SYSTEM</div><div class="body">The secure backend URL must be configured after the phone backend and Cloudflare Tunnel are ready.</div></div></section><form class="composer" id="form"><div class="entry"><textarea id="prompt" rows="2" placeholder="Send a message to the core..." required></textarea><button id="send" type="submit">SEND ↗</button></div><div class="note">ENTER TO SEND · SHIFT+ENTER FOR A NEW LINE</div></form></main>
<script>
const API_BASE="https://CONFIGURE-YOUR-SECURE-BACKEND";
const $=id=>document.getElementById(id);
function message(role,text){const w=document.createElement("div");w.className="msg "+(role==="YOU"?"user":"");const h=document.createElement("div");h.className="who";h.textContent=role;const b=document.createElement("div");b.className="body";b.textContent=text;w.append(h,b);$("messages").append(w);w.scrollIntoView({behavior:"smooth",block:"end"})}
$("form").addEventListener("submit",async e=>{e.preventDefault();const prompt=$("prompt").value.trim();if(!prompt)return;if(API_BASE.includes("CONFIGURE-YOUR")){message("SYSTEM","Backend URL is not configured yet.");return}message("YOU",prompt);$("prompt").value="";$("send").disabled=true;$("status").textContent="PROCESSING";try{const r=await fetch(API_BASE+"/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"artificial-brain-qwen2.5-1.5b:latest",messages:[{role:"user",content:prompt}],stream:false})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||"Backend request failed");message("ARTIFICIAL BRAIN",d.choices?.[0]?.message?.content||"Empty response");$("status").textContent="BACKEND CONNECTED"}catch(err){message("SYSTEM",err.message);$("status").textContent="CONNECTION ERROR"}finally{$("send").disabled=false;$("prompt").focus()}});
</script></body></html>
